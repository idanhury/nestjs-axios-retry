<!doctype html>
<html>
  <head>
    <title>GET Requests</title>
  </head>
  <body>
    <script>
      const baseUrl = 'http://localhost:3000';

      function promise(index) {
        return new Promise(async (resolve, reject) => {
          const delay = 0;
          setTimeout(async () => {
            // const startTime = new Date();
            const response = await fetch(`${baseUrl}`);
            resolve('ok');
          });
        });
      }

      let time0;
      let time1;
      let time2;
      let time3;

      async function executePromises() {
        for (let index = 0; index < 4; index++) {
          if (index === 0) {
            time0 = new Date();
          }

          if (index === 1) {
            time1 = new Date();
          }
          promise(index);

          if (index === 2) {
            time2 = new Date();
          }

          if (index === 3) {
            time3 = new Date();
          }
        }

        console.log('A', (time2 - time0) / 1000);
        console.log('B', (time3 - time1) / 1000);
      }

      executePromises();
    </script>
  </body>
</html>
